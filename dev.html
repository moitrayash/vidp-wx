<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VIDP — restricted</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/fonts.css" />
<style>
  :root{--serif:"Computer Modern Serif",Georgia,serif;--sans:"Computer Modern Sans","Helvetica Neue",Arial,sans-serif;--accent:#1a3a6b;}
  html,body{margin:0;height:100%;background:#fff;color:#111;font-family:var(--serif);}
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;}
  #gate .card{width:320px;max-width:88vw;text-align:center;}
  #gate h1{font-family:var(--sans);font-size:20px;font-weight:700;margin:0 0 4px;}
  #gate .sub{font-family:var(--sans);font-size:13px;color:#666;margin-bottom:20px;}
  #gate input{width:100%;font-family:var(--mono),monospace;font-size:18px;letter-spacing:3px;text-align:center;padding:11px;border:1px solid #ccc;border-radius:6px;margin-bottom:10px;}
  #gate button{width:100%;font-family:var(--sans);font-size:15px;padding:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;cursor:pointer;}
  #gate button:hover{background:#16315a;}
  #gate .err{font-family:var(--sans);font-size:13px;color:#b00;min-height:18px;margin-top:10px;}
  #gate .note{font-family:var(--sans);font-size:11px;color:#999;margin-top:18px;}
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <h1>VIDP — METAR &amp; NOTAMs</h1>
    <div class="sub">Restricted. Enter password to continue.</div>
    <form onsubmit="tryUnlock();return false;">
      <input id="pw" type="password" inputmode="numeric" placeholder="••••••" autocomplete="off" autofocus />
      <button type="submit">Enter</button>
    </form>
    <div class="err" id="err"></div>
    <div class="note">Authorized access only · dev build</div>
  </div>
</div>

<script>
const PW = "5429218";
const KEY = "vidp_auth_ok";

function tryUnlock(){
  const v = document.getElementById('pw').value.trim();
  if(v === PW){ try{ localStorage.setItem(KEY, "1"); }catch(e){} boot(); }
  else { document.getElementById('err').textContent = "Incorrect password."; document.getElementById('pw').value=''; }
}

// Hardened refresh, injected into the live app after its own scripts load.
// Runs in the app's global scope, so it can reassign refresh/LAST and call render/parseMetarObs/setStatus.
function PATCH(){
  const STATION = 'VIDP';
  const GETP = [
    u => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u),
    u => 'https://test.cors.workers.dev/?' + encodeURIComponent(u),
    u => 'https://corsproxy.org/?url=' + encodeURIComponent(u),
    u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  ];
  const POSTP = [
    u => 'https://test.cors.workers.dev/?' + encodeURIComponent(u),
    u => 'https://api.cors.lol/?url=' + encodeURIComponent(u),
  ];
  const SRC = [
    () => 'https://aviationweather.gov/api/data/metar?ids=' + STATION + '&format=raw',
    () => 'https://metar.vatsim.net/' + STATION,
    () => 'https://tgftp.nws.noaa.gov/data/observations/metar/stations/' + STATION + '.TXT',
  ];
  const timeoutSignal = ms => { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; };
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

  async function getVia(wrap, url){
    const r = await fetch(wrap(url), { cache:'no-store', signal: timeoutSignal(8000) });
    if(!r.ok) throw new Error('s'+r.status);
    const t = (await r.text()).trim();
    if(!t) throw new Error('empty');
    return t;
  }
  function extractMetar(text){
    const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
    for(let i = lines.length - 1; i >= 0; i--){
      const ln = lines[i].replace(/=+\s*$/,'').trim();
      if(ln.includes(STATION) && /\d{6}Z/.test(ln))
        return (ln.startsWith('METAR') || ln.startsWith('SPECI')) ? ln : ('METAR ' + ln);
    }
    return null;
  }
  // Race EVERY source x proxy combo in parallel; first that yields a valid METAR wins.
  async function liveMetar(){
    const attempts = [];
    for(const s of SRC){ let u; try{ u = s(); }catch(e){ continue; }
      for(const w of GETP){ attempts.push(getVia(w, u).then(t => { const m = extractMetar(t); if(m) return m; throw new Error('noparse'); })); }
    }
    return await Promise.any(attempts);
  }
  async function postVia(wrap, url, body){
    const r = await fetch(wrap(url), { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body, signal: timeoutSignal(9000) });
    if(!r.ok) throw new Error('s'+r.status);
    const j = JSON.parse(await r.text());
    if(!j || !Array.isArray(j.notamList)) throw new Error('nolist');
    return j;
  }
  async function notamPage(offset){
    const body = new URLSearchParams({searchType:'0', designatorsForLocation:STATION, offset:String(offset), notamsOnly:'false', sortColumns:'5 false', sortDirection:'true'}).toString();
    return await Promise.any(POSTP.map(w => postVia(w, 'https://notams.aim.faa.gov/notamSearch/search', body)));
  }
  async function liveNotams(){
    const all = []; let offset = 0;
    for(let p = 0; p < 40; p++){
      const j = await notamPage(offset);
      const list = j.notamList || []; all.push(...list);
      const total = j.totalNotamCount || all.length; offset += list.length;
      if(list.length === 0 || all.length >= total) break;
    }
    return all.map(n => ({ notamNumber:n.notamNumber, facilityDesignator:n.facilityDesignator, featureName:n.featureName,
      issueDate:n.issueDate, startDate:n.startDate, endDate:n.endDate,
      icaoMessage:(n.icaoMessage||'').trim(), traditionalMessage:(n.traditionalMessage||'').trim() }));
  }
  async function loadSnap(){ try{ const r = await fetch('./data.json?t='+Date.now(), {cache:'no-store'}); if(r.ok) return await r.json(); }catch(e){} return null; }
  function obsMs(metar){ try{ return parseMetarObs(metar) || 0; }catch(e){ return 0; } }

  function flash(data){
    let f = document.getElementById('devflash');
    if(!f){ f = document.createElement('div'); f.id = 'devflash';
      f.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;font-family:"Computer Modern Sans",Arial,sans-serif;font-size:13px;padding:8px 14px;border-radius:6px;box-shadow:0 3px 12px rgba(0,0,0,.25);z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;';
      document.body.appendChild(f); }
    const live = data.source && data.source.metar === 'live';
    const znow = new Date().toISOString().slice(11,19);
    const obs = (data.metar && data.metar.match(/\d{6}Z/)) ? data.metar.match(/\d{6}Z/)[0] : '—';
    f.style.background = live ? '#0a7d34' : '#9a6b00';
    f.textContent = '✓ Refreshed ' + znow + 'Z · METAR ' + obs + ' (' + (data.source.metar || '?') + (live?'':' · proxies blocked, using snapshot') + ')';
    f.style.opacity = '1'; clearTimeout(f._t); f._t = setTimeout(() => { f.style.opacity = '0'; }, 4500);
  }

  async function newRefresh(){
    const btn = document.getElementById('refreshBtn'); if(btn) btn.disabled = true;
    try{ setStatus('', 'Fetching live…'); }catch(e){}
    const [m, n, snap] = await Promise.allSettled([
      withTimeout(liveMetar(), 12000),
      withTimeout(liveNotams(), 16000),
      loadSnap(),
    ]);
    const data = { fetchedAt: new Date().toISOString(), source: {} };
    const liveMet = (m.status === 'fulfilled' && m.value) ? m.value : null;
    const snapData = (snap.status === 'fulfilled') ? snap.value : null;
    // Pick the freshest METAR available (live vs snapshot) so it always moves forward.
    let chosen = liveMet, src = liveMet ? 'live' : null;
    if(snapData && snapData.metar){
      if(!liveMet || obsMs(snapData.metar) > obsMs(liveMet)){ chosen = snapData.metar; src = 'snapshot'; }
    }
    if(chosen){ data.metar = chosen; data.source.metar = src; }
    if(n.status === 'fulfilled' && n.value){ data.notams = n.value; data.source.notams = 'live'; }
    else if(snapData){ data.notams = snapData.notams || []; data.source.notams = 'snapshot'; }
    if(snapData) data.snapshotAt = snapData.generatedAt;
    data.notams = data.notams || [];
    LAST = data;
    try{ render(data); }catch(e){}
    flash(data);
    if(btn) btn.disabled = false;
  }

  // Override the app's refresh, refresh now, and keep auto-refresh on the hardened path.
  refresh = newRefresh;
  newRefresh();
  setInterval(newRefresh, 5 * 60 * 1000);
}

function gateMsg(inner){ const g = document.getElementById('gate'); if(g) g.innerHTML = '<div class="card">' + inner + '</div>'; }
async function boot(){
  if(location.protocol === 'file:'){
    gateMsg('<h1>Open the hosted page</h1><div class="sub">This build must run from the web, not a local file.</div>'
      + '<p style="font-family:var(--sans);font-size:14px;margin-top:14px;"><a href="https://vidp.yashmoitra.com/dev.html">vidp.yashmoitra.com/dev.html</a></p>');
    return;
  }
  gateMsg('<div class="sub">Loading…</div>');
  try{
    const res = await Promise.race([
      fetch('./index.html?t=' + Date.now(), { cache:'no-store' }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout fetching app')), 12000)),
    ]);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    let html = await res.text();
    const inject = '<scr' + 'ipt>(' + PATCH.toString() + ')();</scr' + 'ipt>';
    html = html.replace('</body>', inject + '</body>');
    document.open(); document.write(html); document.close();
  }catch(e){
    gateMsg('<h1>Couldn’t load the app</h1><div class="sub">' + String(e) + '</div>'
      + '<p style="font-family:var(--sans);font-size:13px;margin-top:14px;">Open the hosted page: <a href="https://vidp.yashmoitra.com/dev.html">vidp.yashmoitra.com/dev.html</a></p>');
  }
}

// Remember first successful login on this device.
try{ if(localStorage.getItem(KEY) === "1") boot(); }catch(e){}
</script>
</body>
</html>
